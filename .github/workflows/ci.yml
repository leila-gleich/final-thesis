name: CI Verification

on:
  push:
    branches: [ main, cleanup, base, optimize-structure ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Test & Pipeline Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Test Suite
        run: |
          pytest

      - name: Execute Master Pipeline Entrypoint
        run: |
          python run_pipeline.py
